---
- name: Install apache2, clone, deploy food-app
  hosts: food_app
  become: true

  tasks:
    - name: Stop and disable Nginx
      service:
        name: nginx
        state: stopped
        enabled: false

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install apache2
      package:
        name: apache2
        state: present

    - name: Install git
      package:
        name: git
        state: present

    - name: Remove any default files
      file:
        path: /var/www/html
        state: absent

    - name: clone the code
      git:
        repo: https://github.com/Arunkumarakula/Food-app.git
        dest: /var/www/html

    - name: Ensure apache2 is running
      service:
        name: apache2
        state: started

