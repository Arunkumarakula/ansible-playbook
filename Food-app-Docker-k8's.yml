- name: Deploy Static Food App to Kubernetes
  hosts: localhost
  vars:
    repo_url: "https://github.com/Arunkumarakula/Food-app.git"
    clone_path: "/tmp/foodapp"
    image_name: "arun3647/foodapp:latest"

  tasks:
    - name: Ensure required tools are installed
      become: true
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - git
        - docker.io

    - name: Clone the static Food App repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ clone_path }}"
        force: yes

    - name: Create Dockerfile using Nginx
      copy:
        dest: "{{ clone_path }}/Dockerfile"
        content: |
          FROM nginx:alpine
          COPY . /usr/share/nginx/html
          EXPOSE 80

    - name: Build and push Docker image
      community.docker.docker_image:
        name: "{{ image_name.split(':')[0] }}"
        tag: "{{ image_name.split(':')[1] }}"
        build:
          path: "{{ clone_path }}"
        push: true

    - name: Create Kubernetes manifest for static site
      copy:
        dest: "/tmp/foodapp-deployment.yaml"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: foodapp
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: foodapp
            template:
              metadata:
                labels:
                  app: foodapp
              spec:
                containers:
                - name: foodapp
                  image: {{ image_name }}
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: foodapp-service
          spec:
            type: NodePort
            selector:
              app: foodapp
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30080

    - name: Deploy static app to Kubernetes
      kubernetes.core.k8s:
        state: present
        src: /tmp/foodapp-deployment.yaml
